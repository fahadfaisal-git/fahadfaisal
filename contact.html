<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Fahad</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background: rgb(122, 196, 196);
}

/* Header */
header{
    background:#111;
    padding:20px 8%;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
    gap:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

nav ul li a:hover{
    color:orange;
}

/* Contact */
.contact{
    padding:60px 8%;
}

.contact h2{
    text-align:center;
    margin-bottom:40px;
    font-size:40px;
}

.contact-container{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
}

/* Card */
.contact-card{
    flex:1;
    min-width:280px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.contact-card h3{
    margin-bottom:20px;
}

.contact-card p{
    margin:18px 0;
    color:#555;
    line-height:1.6;
}

/* Form */
.contact-form{
    flex:2;
    min-width:300px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    outline:none;
}

.contact-form textarea{
    height:140px;
    resize:none;
}

.contact-form button{
    background:#111;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
}

.contact-form button:hover{
    background:orange;
}

/* Footer */
footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:50px;
}

.footer-links{
    margin-bottom:10px;
}

.footer-links a{
    color:white;
    text-decoration:none;
    margin:0 12px;
}

.footer-links a:hover{
    color:orange;
}

/* Responsive */
@media(max-width:768px){
    .contact-container{
        flex-direction:column;
    }

    nav{
        flex-direction:column;
        gap:15px;
    }
}
</style>
</head>

<body>

<header>
<nav>
<div class="logo">Fahad</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="contact.html">Contact</a></li>
 <li><a href="services.html">Services</a></li>
</ul>

</nav>
</header>

<section class="contact">

<h2>Contact Me</h2>

<div class="contact-container">

<div class="contact-card">

<h3>Contact Me</h3>

<p>📧 <strong>Email:</strong><br> fahad@gmail.com</p>

<p>☎️ <strong>Phone:</strong><br> +92 300 1234567</p>

<p>📍 <strong>Location:</strong><br> Karachi, Pakistan</p>

<p>💼 <strong>Availability:</strong><br> Available for Freelance & Full-Time</p>

</div>

<div class="contact-form">

<form>

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Your Email" required>

<input type="text" placeholder="Subject">

<textarea placeholder="Your Message"></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</div>

</section>

<footer>
<p>© 2026 Fahad. All Rights Reserved.</p>
</footer>

</body>
</html>
