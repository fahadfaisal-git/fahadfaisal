<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahad Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        header {
            background: #111;
            padding: 20px 8%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        ul a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        ul a:hover {
            color: orange;
        }


       .content {
    height: calc(100vh - 60px);
    background: url("bg.jpg") center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    padding: 20px;
}

.content h1 {
    font-size: 45px;
    margin-bottom: 15px;
}

.content p {
    font-size: 20px;
    margin-bottom: 25px;
}

.btn {
background: black;
   color: white;
padding: 12px 30px;
text-decoration: none;
border-radius: 5px;
}

.btn:hover {
  background: orange;
 }

@media(max-width:600px) {

nav {
flex-direction: column;
gap: 15px;
}

ul {
gap: 15px;
}

.content h1 {
font-size: 32px;
}

.content p {
font-size: 16px;
}
}
footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 30px 10%;
}

.footer-content h3 {
    font-size: 25px;
    margin-bottom: 10px;
}

.footer-content p {
    color: #ccc;
    margin-bottom: 15px;
}

.links {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
}

.links a {
    color: white;
    text-decoration: none;
}

.links a:hover {
    color: orange;
}

.copyright {
    font-size: 14px;
}



    </style>
</head>

<body>

<header>
    <nav>
        <div class="logo">Fahad</div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
             <li><a href="services.html">Services</a></li>
        </ul>
    </nav>
</header>


<section class="content">

    <h1>Hello, My Name Is Fahad</h1>

    <p>
        I build clean and responsive websites using HTML, CSS & JavaScript.
    </p>

    <a href="about.html" class="btn">Learn More</a>

</section>
<footer>
    <div class="footer-content">

        <h3>Fahad</h3>

        <p>
            Building clean and responsive websites with HTML, CSS & JavaScript.
        </p>

        <div class="links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="#">Projects</a>
        </div>

        <p class="copyright">
            © 2026 Fahad. All Rights Reserved.
        </p>

    </div>
</footer>

</body>
</html>
